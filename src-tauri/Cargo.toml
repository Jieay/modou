[package]
name = "app"
version = "0.2.12"
description = "墨斗（Modou）：轻量代码编辑器 + 原生终端工具"
authors = ["zhufeng"]
license = "MIT"
repository = "https://github.com/Jieay/modou"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["custom-protocol", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
rustix = { version = "0.38", features = ["pty", "process", "termios"] }
rustix-openpty = "0.1"
libc = "0.2"
git2 = "0.19"
notify = "6"

toml = "0.8"
core-foundation = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
